name = "allinoneime-site"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [
  { pattern = "allinoneime.com", custom_domain = true },
  { pattern = "www.allinoneime.com", custom_domain = true },
  { pattern = "plugins.allinoneime.com", custom_domain = true },
  { pattern = "languages.allinoneime.com", custom_domain = true },
]

# The site's pages and images; the Worker runs first (plugins host, /download, /docs), then serves them.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

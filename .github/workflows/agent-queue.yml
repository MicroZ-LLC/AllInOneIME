# Every hour: merges the agent pipeline's PRs whose required checks passed and closes their issues
# (`pipeline.py --finish`: every agent:merging issue; a failed check is said once on the issue), then starts the oldest
# agent:queued issue again (it ran out of the Max plan's usage, or had no open release branch to build on) when the
# Agent workflow isn't already running or waiting.
name: Agent queue

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write          # starts a PR's checks again, and the Agent workflow
  checks: read
  contents: write         # merges a PR, deletes its branch
  issues: write
  pull-requests: write
  statuses: read

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: Merge what passed its checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/agent/pipeline.py --finish

  dispatch:
    needs: finish
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy=$(gh run list -R "$GITHUB_REPOSITORY" --workflow agent.yml --limit 20 --json status \
            --jq '[.[] | select(.status != "completed")] | length')
          [ "$busy" = 0 ] || { echo "The Agent workflow is busy."; exit 0; }
          issue=$(gh issue list -R "$GITHUB_REPOSITORY" --label agent:queued --state open --json number,createdAt \
            --jq 'sort_by(.createdAt) | .[0].number // empty')
          [ -n "$issue" ] || { echo "Nothing is queued."; exit 0; }
          gh workflow run agent.yml -R "$GITHUB_REPOSITORY" -f issue="$issue"
          echo "Started #$issue again."

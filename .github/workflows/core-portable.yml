# Keeps the core (Core/, a package of its own) standalone. Every job works on an export of Core/ alone (`git archive
# HEAD:Core`, beside the checkout, so that nothing above it is there), as the core's own repository will be: the lint
# guards (Scripts/check-core-portable.sh, its self-test, Scripts/check-core-standalone.sh) must pass, and on macOS the
# core and its tests must build, in release too. The Linux and Windows jobs were removed in 0.7.4 (owner, 2026-11-14:
# no Linux or Windows users for now; Windows/ moves to its own repository in 0.7.5, with its own CI). The tests run in
# full on the Mac with `make test`.
name: Core on other platforms

on:
  pull_request:
  push:
    branches: [mainline, "release-*"]

concurrency:
  group: core-portable-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export the core alone
        run: mkdir ../core && git archive HEAD:Core | tar -x -C ../core
      - run: ../core/Scripts/check-core-portable-test.sh
      - run: ../core/Scripts/check-core-portable.sh
      - run: ../core/Scripts/check-core-standalone.sh

  macos:
    # The core uses the macOS 27 SDK's FoundationModels API (Xcode 27); macos-26 ships Xcode 26.x.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Export the core alone
        run: mkdir ../core && git archive HEAD:Core | tar -x -C ../core
      - uses: actions/cache@v4
        with:
          path: ../core/.build
          key: macos-${{ hashFiles('Core/Package.resolved') }}-${{ github.sha }}
          restore-keys: macos-${{ hashFiles('Core/Package.resolved') }}-
      - name: Build the core and its tests
        run: swift build --build-tests
        working-directory: ../core
      - name: Build the core in release
        run: Scripts/check-core-standalone.sh --release
        working-directory: ../core

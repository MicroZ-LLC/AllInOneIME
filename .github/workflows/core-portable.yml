# Keeps the core (Core/, its own package) building off the Mac: on Linux and Windows, the core and its tests must build,
# and the lint guard (Core/Scripts/check-core-portable.sh) and its self-test must pass. On Windows the suites of
# what differs there (paths, the folder swap, the word list) run too; the rest aren't run here yet: some still fail
# there for known reasons (the tools in the image, POSIX programs, Apple-only assumptions).
name: Core on other platforms

on:
  pull_request:
  push:
    branches: [mainline, "release-*"]

concurrency:
  group: core-portable-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: Core/Scripts/check-core-portable-test.sh
      - run: Core/Scripts/check-core-portable.sh

  linux:
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Core/.build
          key: linux-swift-6.4-${{ hashFiles('Core/Package.resolved') }}-${{ github.sha }}
          restore-keys: linux-swift-6.4-${{ hashFiles('Core/Package.resolved') }}-
      - name: Build the core
        run: swift build --package-path Core --target AllInOneIMECore
      - name: Build the tests
        run: swift build --package-path Core --build-tests

  # The same on Windows (windows-latest, Swift 6.4.1 from swift.org; the toolchain finds Visual Studio's MSVC and the
  # Windows SDK by itself, no developer prompt needed). The test files that call POSIX directly are left out there
  # (Core/Package.swift).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057  # v0.5.0
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
          cache: true
      - uses: actions/cache@v4
        with:
          path: Core/.build
          key: windows-swift-6.4.1-${{ hashFiles('Core/Package.resolved') }}-${{ github.sha }}
          restore-keys: windows-swift-6.4.1-${{ hashFiles('Core/Package.resolved') }}-
      - name: Build the core
        run: swift build --package-path Core --target AllInOneIMECore
      - name: Build the tests
        run: swift build --package-path Core --build-tests
      - name: Run the tests of what differs on Windows
        run: swift test --package-path Core --skip-build --filter 'PathCheckTests|SwapRecoveryTests|RedactionWordListTests'

# Keeps the wiki's Chinese pages in step with its English ones: when a wiki page is edited (or by hand),
# Scripts/translate-wiki.py translates each English page that changed and the result is pushed to the wiki.
# Runs on the Mac mini, on the Max plan through its Claude Code sign-in (no API key).
name: Translate the wiki into Chinese

on:
  gollum:
  workflow_dispatch:
    inputs:
      force:
        description: Translate every page, even unchanged ones
        type: boolean
        default: false

concurrency:
  group: wiki-zh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  translate:
    runs-on: [self-hosted, macmini-agent]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # screenshots are pinned to commits; any of them may be looked up
      - name: Clone the wiki
        run: git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git" wiki
      - name: Translate
        run: python3 Scripts/translate-wiki.py wiki ${{ inputs.force && '--force' || '' }}
      - name: Push
        working-directory: wiki
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          # Dated as the edit that was translated, so the wiki's history keeps the time it was written.
          date=$(git log -1 --format=%aI)
          GIT_COMMITTER_DATE="$date" git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q --date="$date" -m "Chinese pages translated from the English ones"
          git push -q

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'">
<title>AllInOneIME Electron harness</title>
<style>
  body { font: 14px -apple-system, sans-serif; margin: 16px; }
  .composer { border: 1px solid #888; border-radius: 6px; min-height: 40px; padding: 8px; margin-bottom: 12px;
              white-space: pre-wrap; }
  textarea { width: 100%; height: 60px; }
</style>
</head>
<body>
<!-- Like Slack's composer: a contenteditable with role textbox (Quill's ql-editor). -->
<div class="composer ql-editor" id="composer" contenteditable="true" role="textbox" aria-multiline="true"
     data-qa="message_input" spellcheck="true"></div>
<textarea id="textarea"></textarea>
<script>
  // What the page sees, on the harness's stderr. Nothing here handles Shift: the page lets it go by, as Slack's does.
  const log = (...a) => console.log(...a);
  for (const type of ['keydown', 'keyup', 'compositionstart', 'compositionend', 'beforeinput', 'focus', 'blur']) {
    document.addEventListener(type, e => log(type, e.key ?? '', e.code ?? '', e.target.id || e.target.nodeName,
                                             e.shiftKey ? 'shift' : '', e.repeat ? 'repeat' : ''), true);
  }
  window.addEventListener('focus', () => log('window focus'));
  window.addEventListener('blur', () => log('window blur'));
  // Slack listens to keys at the document level for its shortcuts: a handler that looks at Shift and lets it go by.
  document.addEventListener('keydown', e => { if (e.key === 'Shift') { document.body.dataset.shift = '1' } });
  document.addEventListener('keyup', e => { if (e.key === 'Shift') { delete document.body.dataset.shift } });
  // A busy page (Slack's often is, for 100 ms and more): each key down takes `busy` ms, and the app sends it through
  // again only after that, after the keys that came meanwhile.
  const query = new URLSearchParams(location.search);
  const busy = Number(query.get('busy')) || 0;
  if (busy > 0) {
    document.addEventListener('keydown', () => { const end = performance.now() + busy; while (performance.now() < end) {} });
  }
  // Like Slack's composer: a key down of Enter (keyCode 13, not composing, no Shift) sends the message. Its text stays
  // (Slack's goes), so what the field ends with can be read. ↑, ↓, →, ← and Esc it acts on as well (Slack's ↑ edits a
  // message, Esc leaves the composer …): said, and the key goes on (an arrow moves the caret). On the harness's stdout
  // for the self-test, as "PAGE <what> <JSON>" lines: each key down's key, keyCode and isComposing, what was sent or
  // acted on, the field's text as it changes, and after each key (its key up) where the caret is ([start, end], UTF-16)
  // and whether the field still has the focus.
  const page = (what, value) => log('PAGE ' + what + ' ' + JSON.stringify(value));
  const target = query.get('field') || 'composer';
  const field = document.getElementById(target);
  const text = () => field.value ?? field.textContent;
  // HARNESS_AFTER: text after the caret, the caret at the start.
  const after = query.get('after') || '';
  if (after) {
    if (field.value !== undefined) { field.value = after; } else { field.textContent = after; }
  }
  const caret = () => {
    if (field.selectionStart !== undefined) return [field.selectionStart, field.selectionEnd];
    const selection = getSelection();
    if (!selection.rangeCount || !field.contains(selection.anchorNode)) return null;
    const range = selection.getRangeAt(0), before = document.createRange();
    before.selectNodeContents(field);
    before.setEnd(range.startContainer, range.startOffset);
    const start = before.toString().length;
    return [start, start + range.toString().length];
  };
  const acted = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Escape'];
  field.addEventListener('keydown', e => {
    page('keydown', { key: e.key, keyCode: e.keyCode, isComposing: e.isComposing });
    if (e.key === 'Enter' && e.keyCode === 13 && !e.isComposing && !e.shiftKey) {
      e.preventDefault();
      page('sent', text());
    } else if (acted.includes(e.key) && e.keyCode !== 229 && !e.isComposing) {
      page('acted', e.key);
    }
  });
  document.addEventListener('keyup', () => page('caret', { at: caret(), focused: document.activeElement === field }));
  for (const type of ['input', 'compositionend']) field.addEventListener(type, () => page('text', text()));
  field.focus();
  if (after && field.selectionStart !== undefined) {
    field.setSelectionRange(0, 0);
  } else if (after) {
    getSelection().collapse(field.firstChild, 0);
  }
  log('focused', document.activeElement.id, 'hasFocus', document.hasFocus());
</script>
</body>
</html>
